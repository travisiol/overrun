<svg xmlns="http://www.w3.org/2000/svg" width="338" height="600" viewBox="0 0 338 600" fill="none">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7E8F5C"/>
      <stop offset="45%" stop-color="#9CAD78"/>
      <stop offset="100%" stop-color="#6C7C4C"/>
    </linearGradient>
    <linearGradient id="plank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E4D4B0"/>
      <stop offset="100%" stop-color="#C9B68D"/>
    </linearGradient>
  </defs>

  <!-- forearm, rising out of the mound -->
  <g stroke="#24240F" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M140 600c-6-92-2-168 8-232 4-26 9-48 14-70l62 14c-6 24-12 50-16 78-8 62-9 138-4 210z" fill="url(#skin)"/>
    <!-- torn sleeve -->
    <path d="M134 476c2-26 4-50 7-72l70 14c-3 22-6 46-7 72l-14-16-12 18-12-16-13 16-11-16z" fill="#3A3524"/>
    <!-- palm -->
    <path d="M167 300c-8-30 2-52 24-58 10-3 20-1 27 5l40 34c9 8 11 20 5 29-6 10-19 13-29 6l-14-9 6 20c4 13-3 26-16 30-14 4-28-4-32-18z" fill="url(#skin)"/>
    <!-- fingers wrapped around the post -->
    <path d="M186 258c-4-13 3-25 16-28 12-3 24 4 27 16l7 26-42 12z" fill="#93A470"/>
    <path d="M212 246c-4-13 3-25 15-28 12-3 24 4 28 16l7 25-43 12z" fill="#9EAF7B"/>
    <path d="M238 240c-4-12 3-24 15-27 12-3 24 4 27 15l6 24-41 11z" fill="#93A470"/>
    <!-- thumb -->
    <path d="M176 322c-12-4-18-16-14-27 4-11 17-16 28-11l24 12-14 34z" fill="#8A9B67"/>
  </g>

  <!-- rotted knuckle seams -->
  <g stroke="#3E4426" stroke-width="3" stroke-linecap="round" opacity="0.65">
    <path d="M196 268h20M222 256h20M248 250h18M172 372c14 4 30 4 44 0M166 424c16 4 34 4 50 0"/>
  </g>

  <!-- the post, then the signboard on top of it -->
  <g transform="rotate(11 183 104)">
    <rect x="172" y="120" width="26" height="150" rx="4" fill="#B49A6A" stroke="#24240F" stroke-width="5"/>
    <rect x="100" y="42" width="166" height="122" rx="8" fill="url(#plank)" stroke="#24240F" stroke-width="6"/>
    <g stroke="#B0996F" stroke-width="2" opacity="0.8">
      <path d="M100 78h166M100 126h166"/>
    </g>
    <g fill="#8E7A52">
      <circle cx="114" cy="56" r="4"/>
      <circle cx="252" cy="56" r="4"/>
      <circle cx="114" cy="150" r="4"/>
      <circle cx="252" cy="150" r="4"/>
    </g>
  </g>
</svg>
