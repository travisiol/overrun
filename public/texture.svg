<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <!-- Film grain laid over the whole hero. Generated by the filter rather than
       shipped as a bitmap so it stays sharp at any viewport size. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="linear" slope="0.55"/>
    </feComponentTransfer>
  </filter>
  <rect width="600" height="600" filter="url(#grain)" opacity="0.6"/>
</svg>
